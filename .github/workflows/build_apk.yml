name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Configure Buildozer using GitHub Pre-installed SDK (No Downloads)
      run: |
        # ১. বিল্ডওজার ইনিশিয়াল কনফিগ রেডি করা
        buildozer init
        
        # ২. স্পেক ফাইলের ভেতরের রিকোয়ারমেন্টস ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

        # ৩. গিটহাবের নিজস্ব প্রি-ইনস্টলড SDK-কে বিল্ডওজারের ফোল্ডারের সাথে সরাসরি যুক্ত করা
        mkdir -p /home/runner/.buildozer/android/platform
        ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk

        # ৪. বিল্ডওজার যে পুরোনো 'tools/bin' পাথটি খুঁজছে, সেখানে সিস্টেমের প্রি-ইনস্টলড sdkmanager টিকে লিংক করা
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true

    - name: Build Android App with Buildozer
      run: |
        # সরাসরি লাইসেন্স বাইপাস করে ফাইনাল কম্পাইল প্রসেস রান করা
        yes | buildozer android debug
      env:
        HOME: /home/runner
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
