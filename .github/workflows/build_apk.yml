name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev wget
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Pre-install Android SDK Manager (Fix Broken Pipe & SDK Missing)
      run: |
        # ১. বিল্ডওজার ও এসডিকে ডিরেক্টরি আগে থেকেই তৈরি করা
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
        cd /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # ২. গুগলের অফিশিয়াল লেটেস্ট কমান্ড-লাইন টুলস সরাসরি ডাউনলোড করা
        wget https://google.com -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        rm cmdline-tools.zip
        
        # ৩. গুগলের নতুন রিকোয়ার্ড ডিরেক্টরি স্ট্রাকচার (cmdline-tools/latest/bin) ফিক্স করা
        mv cmdline-tools latest
        
        # ৪. লাইসেন্স ফোল্ডার তৈরি করে প্রি-অ্যাকসেপ্ট করা
        mkdir -p ../licenses
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ../licenses/android-sdk-license
        
        # ৫. ওল্ড পাথের জন্য একটি ব্যাকআপ সিমলিংক (Symlink) তৈরি করা যাতে বিল্ডওজার কনফিউজড না হয়
        mkdir -p ../tools/bin
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ../tools/bin/sdkmanager

    - name: Initialize and Fix Buildozer Spec
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

    - name: Build with Buildozer (Final Action)
      run: |
        # সরাসরি লাইসেন্স একসেপ্ট সহ ফাইনাল কম্পাইল
        buildozer android debug --yes
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
