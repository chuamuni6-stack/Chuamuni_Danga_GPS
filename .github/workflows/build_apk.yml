name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Set up Android SDK Tools & Auto Accept Licenses
      run: |
        # ১. বিল্ডওজার ইনিশিয়াল কনফিগ রেডি করা
        buildozer init
        
        # ২. স্পেক ফাইলের ভেতরের রিকোয়ারমেন্টস এবং লাইসেন্স ফ্ল্যাগ কনফিগার করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # ৩. গুগলের লাইসেন্স ফাইলগুলো অটোমেটিকলি এগ্রিমেন্ট সাইন করার জন্য ডিরেক্টরি সেটআপ (আলটিমেট হ্যাক)
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/mostafizur/.buildozer/android/platform/android-sdk/licenses/android-sdk-license 2>/dev/null || true
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license 2>/dev/null || true

    - name: Build with Buildozer (Forced Mode)
      run: |
        # টার্মিনালের স্ট্যান্ডার্ড ইনপুট পাইপ ব্যবহার করে গুগলের প্রতিটি প্রম্পটে জোরপূর্বক 'yes' পাঠানো
        yes | buildozer android debug
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
