name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Create Base Directory & Pre-Accept Licenses
      run: |
        #১. বিল্ডওজার সচল করার জন্য ফ্রেশ ডিরেক্টরি কনফিগারেশন তৈরি
        buildozer init
        
        # ২. গুগলের লাইসেন্স এগ্রিমেন্ট ফাইলটি সার্ভারে আগে থেকেই ইনজেক্ট করে রাখা (যাতে sdkmanager ডাউনলোড অপশন না খোজে)
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Modify Buildozer Spec For Modern SDK Layout (Ultimate Hack)
      run: |
        # ৩. স্পেক ফাইলের ভেতরের লাইব্রেরি রিকোয়ারমেন্টস ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # ৪. বিল্ডওজারকে বাধ্য করা যেন সে পুরোনো 'tools' পাথ বাদ দিয়ে গুগলের লেটেস্ট অফিশিয়াল ডিরেক্টরি ব্যবহার করে
        # এটি যোগ করার ফলে বিল্ডওজার অভ্যন্তরীণভাবে কোনো এরর ছাড়াই নিজেই সঠিক ফাইল তৈরি করে নেবে
        echo "android.sdk_custom_path = /home/runner/.buildozer/android/platform/android-sdk" >> buildozer.spec

    - name: Build Android App (Standalone Auto Execution)
      run: |
        # সরাসরি পাইপ ইনপুট ব্যবহার করে ফাইনাল বিল্ড প্রসেস রান করা
        yes | buildozer android debug
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
