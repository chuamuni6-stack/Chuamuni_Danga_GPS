name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Set up JDK 17 (Required by Google SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Pre-Accept All Google Android SDK Licenses (Official Dynamic Bypass)
      uses: android-actions/setup-android@v3
      with:
        log-accepted-licenses: true

    - name: Initialize and Fix Buildozer Config
      run: |
        buildozer init
        # স্পেক ফাইলের ভেতরের রিকোয়ারমেন্টস এবং গুগল লাইসেন্স ট্র্যাকার ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # গুগলের অফিশিয়াল সিআই/সিডি এনভায়রনমেন্ট পাথটিকে বিল্ডওজারের স্যান্ডবক্সের সাথে ব্রিজ করা
        mkdir -p /home/runner/.buildozer/android/platform
        ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk

    - name: Build Android App (Standalone Verified Pipe)
      run: |
        # সরাসরি পাইপ ইনপুট ব্যবহার করে ফাইনাল বিল্ড প্রসেস রান করা
        buildozer android debug
      env:
        HOME: /home/runner
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
