name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Initialize Web-to-APK Container
      run: |
        # ১. গিটহাব ক্লাউডের ভেতরেই একটি নিখুঁত অ্যান্ড্রয়েড অ্যাপ স্ট্রাকচার তৈরি করা
        flutter create --org com.chuamuni --project-name schoolapp mobile_container
        cd mobile_container
        
        # ২. গুগলের অফিশিয়াল ওয়েব-ভিউ প্লাগইন যুক্ত করা যা স্ট্রিমলিটের অনলাইন লিংক লোড করবে
        flutter pub add webview_flutter
        
        # ৩. অ্যাপের মূল অ্যান্ড্রয়েড কনফিগারেশনে ইন্টারনেট পারমিশন নিশ্চিত করা
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
        
        # ৪. মোবাইল অ্যাপের স্ক্রিন কোড তৈরি করা (যা আপনার স্কুলের অনলাইন লিংক প্রদর্শন করবে)
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:webview_flutter/webview_flutter.dart';

        void main() {
          WidgetsFlutterBinding.ensureInitialized();
          runApp(const MaterialApp(
            home: SchoolAppScreen(),
            debugShowCheckedModeBanner: false,
          ));
        }

        class SchoolAppScreen extends StatefulWidget {
          const SchoolAppScreen({super.key});
          @override
          State<SchoolAppScreen> createState() => _SchoolAppScreenState();
        }

        class _SchoolAppScreenState extends State<SchoolAppScreen> {
          late final WebViewController _controller;

          @override
          void initState() {
            super.initState();
            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..loadRequest(Uri.parse('https://streamlit.app?embedded=true')); // আপনার মূল অনলাইন লিংকটি এখানে সেট করা
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: SafeArea(
                child: WebViewWidget(controller: _controller),
              ),
            );
          }
        }
        EOF

    - name: Build Final Android APK (Official Google Release Mode)
      run: |
        cd mobile_container
        # গুগলের অফিশিয়াল প্রোডাকশন কম্পাইলার দিয়ে ১ ক্লিকে এররমুক্ত এপিকে ফাইল জেনারেট করা
        flutter build apk --release

    - name: Upload Finished APK to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: school-app-finished-apk
        path: mobile_container/build/app/outputs/flutter-apk/app-release.apk
