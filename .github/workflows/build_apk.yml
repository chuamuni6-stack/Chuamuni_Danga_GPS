name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Build and Configure Buildozer Spec
      run: |
        # যদি আগে থেকে ফাইল না থাকে তবে একটি ফ্রেশ ডিরেক্টরি স্পেক তৈরি করা
        buildozer init
        
        # স্পেক ফাইলের ভেতরের রিকোয়ারমেন্টস অটো-আপডেট করা (Streamlit এর পরিবর্তে Kivy/WebView সেটআপের জন্য)
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

    - name: Build with Buildozer (Auto Accept)
      run: |
        # সরাসরি লাইসেন্স একসেপ্ট সহ ফাইনাল কম্পাইল
        buildozer android debug --yes
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
