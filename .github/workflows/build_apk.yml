name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Pre-Configure Buildozer Settings (Fix SDK Manager Bug)
      run: |
        # ১. একটি ফ্রেশ বিল্ডওজার কনফিগ তৈরি করা
        buildozer init
        
        # ২. স্পেক ফাইলের প্রয়োজনীয় অ্যান্ড্রয়েড রিকোয়ারমেন্টস ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        
        # ৩. বিল্ডওজারকে নির্দেশ দেওয়া যেন সে থার্ড-পার্টি টুল ব্যবহার না করে নিজেই লাইসেন্স একসেপ্ট করে
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # ৪. গুগলের নতুন এসডিকে লকিং এড়াতে লাইসেন্স ফাইল সরাসরি প্রি-ইনজেক্ট করা (আলটিমেট হ্যাক)
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build Android App (Standalone Mode)
      run: |
        # কোনো নোড জেএস বা এক্সটার্নাল এসডিকে ছাড়াই বিল্ডওজারকে তার নিজস্ব ডিরেক্টরিতে স্বাধীনভাবে রান করানো
        buildozer android debug --yes
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
