name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: Build Standalone Non-Login Container
      run: |
        # ১. ফ্রেশ অ্যান্ড্রয়েড কন্টেইনার তৈরি করা
        flutter create --org com.chuamuni --project-name schoolapp mobile_container
        cd mobile_container
        
        # ২. প্লাগইনের স্টেবল ও লেটেস্ট সংস্করণ সুনির্দিষ্টভাবে যুক্ত করা (যা নতুন প্রোগার্ড রুল সাপোর্ট করে)
        flutter pub add flutter_inappwebview:6.1.0+5
        
        # ৩. অ্যাপের মূল অ্যান্ড্রয়েড কনফিগারেশনে ইন্টারনেট পারমিশন নিশ্চিত করা
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
        
        # ৪. গুগলের নতুন R8 অপ্টিমাইজার ক্র্যাশ এড়াতে গ্রেডল প্রপার্টিজে প্রোগার্ড লক বাইপাস যুক্ত করা
        echo "android.enableR8.fullMode=false" >> android/gradle.properties
        echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

        # ৫. মোবাইল অ্যাপের মেইন স্ক্রিন কোড তৈরি করা (লগইন ইন্টারসেপ্টর সহ)
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:flutter_inappwebview/flutter_inappwebview.dart';

        void main() {
          WidgetsFlutterBinding.ensureInitialized();
          runApp(const MaterialApp(
            home: SchoolAppScreen(),
            debugShowCheckedModeBanner: false,
          ));
        }

        class SchoolAppScreen extends StatefulWidget {
          const SchoolAppScreen({super.key});
          @override
          State<SchoolAppScreen> createState() => _SchoolAppScreenState();
        }

        class _SchoolAppScreenState extends State<SchoolAppScreen> {
          InAppWebViewController? webViewController;

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: SafeArea(
                child: InAppWebView(
                  initialUrlRequest: URLRequest(
                    url: WebUri("https://streamlit.app")
                  ),
                  initialSettings: InAppWebViewSettings(
                    javaScriptEnabled: true,
                    domStorageEnabled: true,
                    databaseEnabled: true,
                    thirdPartyCookiesEnabled: true,
                    userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  ),
                  onWebViewCreated: (controller) {
                    webViewController = controller;
                  },
                  onLoadStart: (controller, url) {
                    if (url != null && (url.toString().contains("login") || url.toString().contains("://github.com"))) {
                      controller.loadUrl(urlRequest: URLRequest(url: WebUri("https://streamlit.app")));
                    }
                  },
                ),
              ),
            );
          }
        }
        EOF

    - name: Build Final Android APK (Official Release Mode)
      run: |
        cd mobile_container
        flutter build apk --release

    - name: Upload Finished APK to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: school-app-finished-apk
        path: mobile_container/build/app/outputs/flutter-apk/app-release.apk
