name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Set up Android SDK & Accept All Licenses (Official GitHub Method)
      uses: android-actions/setup-android@v3

    - name: Initialize and Configure Buildozer Spec
      run: |
        buildozer init
        # স্পেক ফাইলের প্রয়োজনীয় অ্যান্ড্রয়েড সেটিংস ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # গিটহাবের অফিশিয়াল অ্যান্ড্রয়েড পাথটি বিল্ডওজারের হোমে লিংক করে দেওয়া (আলটিমেট ফিক্স)
        mkdir -p /home/runner/.buildozer/android/platform
        ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk

    - name: Build with Buildozer (Final Execution)
      run: |
        buildozer android debug --yes
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
