name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04 # একটি স্টেবল ও ফিক্সড উবুন্টু সংস্করণ ব্যবহার করা হলো
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Initialize Buildozer Config if not exists
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Build with Buildozer (Auto Accept Licenses)
      run: |
        # এখানে '--yes' ফ্ল্যাগ যুক্ত করা হয়েছে যেন গিটহাব নিজে থেকেই সব অ্যান্ড্রয়েড লাইসেন্স একসেপ্ট করে নেয়
        buildozer android debug --yes
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
