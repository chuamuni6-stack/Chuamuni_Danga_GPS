name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies & Google Android SDK Manager
      run: |
        sudo apt update
        # উবুন্টুর অফিশিয়াল নিরাপদ চ্যানেল থেকে সরাসরি sdkmanager এবং android-sdk প্রি-ইনস্টল করা
        sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev autoconf automake libtool zlib1g-dev libncurses-dev wget sdkmanager android-sdk
        pip install --upgrade pip
        pip install buildozer cython setuptools wheel

    - name: Fix Google Modern Directory Bridge & Pre-Accept Licenses (Permission Unlocked)
      run: |
        # ১. বিল্ডওজার সচল করার জন্য ফ্রেশ ডিরেক্টরি তৈরি
        buildozer init
        
        # ২. স্পেক ফাইলের ভেতরের লাইব্রেরি রিকোয়ারমেন্টস ফিক্স করা
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android,pandas,requests/g' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # ৩. উবুন্টুর প্রি-ইনস্টলড অফিশিয়াল SDK-কে কপি করে ইউজার ডিরেক্টরিতে আনা (পারমিশন লক এড়ানোর বেস্ট মেথড)
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk
        sudo cp -r /usr/lib/android-sdk/* /home/runner/.buildozer/android/platform/android-sdk/ || true
        
        # ৪. রুট লকিং দূর করতে পুরো ফোল্ডারের ওপর ইউজারকে রাইট পারমিশন (Read/Write) দেওয়া
        sudo chmod -R 777 /home/runner/.buildozer/android/platform/android-sdk
        
        # ৫. বিল্ডওজার যে পুরোনো 'tools/bin' পাথটি খুঁজছে, সেখানে সিস্টেমের আসল sdkmanager টিকে লিংক (Symlink) করে দেওয়া
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        ln -s /usr/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # ৬. গুগলের লাইসেন্স কি ডিরেক্টরি ইনজেক্ট করা
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d197f42d744b\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build Android App (Standalone Secured Mode)
      run: |
        # সরাসরি লাইসেন্স বাইপাস করে ফাইনাল কম্পাইল প্রসেস সচল করা
        yes | buildozer android debug
      env:
        HOME: /home/runner

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-apk
        path: bin/*.apk
