name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Standalone Non-Login Container
      run: |
        # ১. গিটহাব ক্লাউডের ভেতরেই একটি ফ্রেশ অ্যান্ড্রয়েড কন্টেইনার তৈরি করা
        flutter create --org com.chuamuni --project-name schoolapp mobile_container
        cd mobile_container
        
        # ২. গুগলের অফিশিয়াল ইন-অ্যাপ ওয়েব ইঞ্জিন প্লাগইন যুক্ত করা
        flutter pub add webview_flutter
        
        # ৩. অ্যাপের মূল অ্যান্ড্রয়েড কনফিগারেশনে সম্পূর্ণ সিকিউর পারমিশন নিশ্চিত করা
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
        
        # ৪. মোবাইল অ্যাপের মেইন স্ক্রিন কোড তৈরি করা (যা সরাসরি সিকিউর গেটওয়ে দিয়ে আপনার অনলাইন লিংক লোড করবে)
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:webview_flutter/webview_flutter.dart';

        void main() {
          WidgetsFlutterBinding.ensureInitialized();
          runApp(const MaterialApp(
            home: SchoolAppScreen(),
            debugShowCheckedModeBanner: false,
          ));
        }

        class SchoolAppScreen extends StatefulWidget {
          const SchoolAppScreen({super.key});
          @override
          State<SchoolAppScreen> createState() => _SchoolAppScreenState();
        }

        class _SchoolAppScreenState extends State<SchoolAppScreen> {
          late final WebViewController _controller;

          @override
          void initState() {
            super.initState();
            _controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..setBackgroundColor(const Color(0x00000000))
              ..setNavigationDelegate(
                NavigationDelegate(
                  onNavigationRequest: (NavigationRequest request) {
                    // যদি স্ট্রিমলিটের ক্লাউড সার্ভার জোর করে লগইন ইউআরএল পুশ করতে চায়, তবে এটি তা সাথে সাথে ব্লক করে দেবে
                    if (request.url.contains('login') || request.url.contains('://github.com')) {
                      return NavigationDecision.prevent;
                    }
                    return NavigationDecision.navigate;
                  },
                ),
              )
              // একটি রিয়েল ডেস্কটপ ক্রোম ব্রাউজারের ইউজার এজেন্ট ব্যবহার করা হলো যাতে ক্লাউড কোনো সিকিউরিটি ফিল্টার ট্রিগার না করে
              ..setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              ..loadRequest(Uri.parse('https://streamlit.app'));
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: SafeArea(
                child: WebViewWidget(controller: _controller),
              ),
            );
          }
        }
        EOF

    - name: Build Final Android APK (Official Release Mode)
      run: |
        cd mobile_container
        flutter build apk --release

    - name: Upload Finished APK to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: school-app-finished-apk
        path: mobile_container/build/app/outputs/flutter-apk/app-release.apk
